# SonarCloud analysis configuration.
#
# scripts/ui-preview is local verification tooling (a read-only mock of the
# Supabase REST/Auth surface + a screenshot harness); it never ships and is
# excluded from static analysis like the SQL fixtures.
#
# Application/source analysis stays focused on production code and migrations.
# TypeScript tests remain test code. The SQL/shell suites under supabase/tests
# are executable PostgreSQL fixtures driven by scripts/db-test.sh; they are
# intentionally excluded from Sonar static analysis but are NOT skipped by the
# canonical database gate.
sonar.sources=src,scripts,supabase/migrations
sonar.tests=tests
sonar.exclusions=supabase/tests/**,scripts/ui-preview/**,التسويق-والإدارة/**/terranex-ops/**

# Forward-only migrations can legitimately restate existing function bodies
# because applied migrations are immutable. Exclude migrations from CPD only;
# all other Sonar issue/security analysis of migrations remains enabled.
sonar.cpd.exclusions=supabase/migrations/**

# terranex-ops (inside the Arabic marketing folder) is local content tooling:
# ffmpeg/PIL scripts run by hand on a workstation; it never ships in the
# application, the same category as scripts/ui-preview above.
