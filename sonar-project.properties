# SonarCloud analysis configuration.
#
# Repository test roots are explicit so executable SQL/shell verification suites
# are analysed as test code rather than production source.
sonar.tests=tests,supabase/tests
sonar.test.inclusions=tests/**,supabase/tests/**

# CPD is meaningful for production logic, not intentionally repetitive test
# fixtures/assertions. Forward-only migrations may also have to restate existing
# function bodies because applied migrations are immutable. These exclusions are
# CPD-only: issues, security analysis and test execution remain unchanged.
sonar.cpd.exclusions=supabase/migrations/**,tests/**,supabase/tests/**
