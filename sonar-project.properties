# SonarCloud analysis configuration.
#
# supabase/tests/* are executable database verification suites (SQL and shell),
# run by the canonical gate scripts/db-test.sh. They are test code, not
# production code, so they are classified as tests for analysis purposes.
sonar.test.inclusions=supabase/tests/**

# Forward-only migration policy (AGENTS.md / DB_DEVELOPMENT.md): applied
# migrations are immutable, so a migration that replaces an existing function
# must restate the full replaced body verbatim. That restatement is a
# structural requirement of the discipline, not copy-paste debt, so migrations
# are excluded from copy-paste detection (CPD) only. All other analysis
# (issues, security hotspots, smells) still runs on them.
sonar.cpd.exclusions=supabase/migrations/**
