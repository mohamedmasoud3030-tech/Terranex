# ---------------------------------------------------------------------------
# Odoo 18 Community — local/self-hosted accounting backend for Terranex
# ---------------------------------------------------------------------------
# This stack runs Odoo as the "accounting engine" beneath the Terranex UI.
# The React app talks to Odoo over JSON-RPC (port 8069, bound to localhost only).
#
# Quick start (on a server or laptop with Docker):
#   cd external/odoo
#   cp .env.example .env
#   # edit .env and set ODOO_MASTER_PASSWORD / ODOO_DB_PASSWORD
#   docker compose up -d
#   # open http://localhost:8069 → create a database:
#   #   - Database name: terranex (or company name)
#   #   - Email/password: choose admin credentials
#   #   - Language: العربية (RTL) or English
#   #   - Country: Egypt / Oman / Saudi Arabia / UAE (loads IFRS chart of accounts)
#   #   - Install modules: Accounting, Contacts, Inventory (only what you need)
#
# The Odoo database is SEPARATE from Supabase:
#   - Supabase (Postgres in the cloud or self-hosted): Terranex domain data
#       projects, partners, ownership, distributions, operational events, documents
#   - Odoo Postgres (in this compose): accounting engine
#       chart of accounts, journal entries, invoices, VAT, bank reconciliation
#
# Data flow:
#   Terranex  → JSON-RPC → Odoo  (one-way sync for Phase 1)
#     - When a Transaction/Settlement/Distribution is saved in Terranex,
#       an equivalent journal entry is posted in Odoo automatically.
#     - Partners/Projects sync as Contacts/Analytic Accounts.
#
# Requirements: Docker + 4GB RAM (2GB min for testing).
# Cost: self-hosted on a $6–12/month VPS, or run locally on your laptop.
# ---------------------------------------------------------------------------
services:
  web:
    image: odoo:18.0-20260725
    container_name: terranex-odoo-web
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Bind to localhost only. Put Nginx/Caddy in front with TLS + basic auth
      # if exposed to the internet. Never expose port 8069 directly.
      - "127.0.0.1:8069:8069"
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./custom-addons:/mnt/extra-addons
    environment:
      - HOST=db
      - PORT=5432
      - USER=odoo
      - PASSWORD=${ODOO_DB_PASSWORD}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1G

  db:
    image: postgres:16-alpine
    container_name: terranex-odoo-db
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=${ODOO_DB_PASSWORD}
      - POSTGRES_USER=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  odoo-web-data:
  odoo-db-data:
