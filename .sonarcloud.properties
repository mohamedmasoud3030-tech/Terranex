# SonarCloud Automatic Analysis configuration.
#
# supabase/tests contains executable SQL/shell fixtures that are run by
# scripts/db-test.sh against PostgreSQL. They are verification inputs, not
# production source files for static-analysis quality metrics.
sonar.exclusions=supabase/tests/**,scripts/ui-preview/**

# Applied migrations are immutable and forward fixes can legitimately restate
# existing database function bodies. Exclude migrations from duplication/CPD
# only; they remain in the normal issue/security analysis scope.
sonar.cpd.exclusions=supabase/migrations/**
