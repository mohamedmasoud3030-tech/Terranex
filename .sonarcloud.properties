# SonarCloud project configuration.
#
# Duplication analysis is meaningful for application/business logic — it is
# not meaningful for pgTAP-style SQL test fixtures, where each scenario
# intentionally repeats a similar "insert owner + project + partner" setup
# block to keep each test self-contained and independently readable. Flagging
# that as a code smell would push toward extracting shared SQL test helpers,
# which historically made these fixtures harder to read in isolation and
# harder to safely re-order/rollback (each `begin; ... rollback;` block needs
# to stand alone). Excluding fixtures/migrations from duplication keeps the
# signal focused on TypeScript/React application code, where duplication is
# an actual maintenance cost.
sonar.cpd.exclusions=\
  supabase/tests/**,\
  supabase/migrations/**,\
  tests/**

# Coverage/analysis should still cover these paths for other checks (bugs,
# vulnerabilities, code smells other than duplication) — only duplication is
# exempted above via sonar.cpd.exclusions, not sonar.exclusions.
