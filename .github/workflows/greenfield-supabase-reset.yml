name: Terranex Final Persistent Demo Verification

on:
  push:
    branches:
      - ops/greenfield-supabase-reset
    paths:
      - .github/workflows/greenfield-supabase-reset.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: nwpyeobuxzbdnnzyfyqw
      PROJECT_ID: 0556711f-0605-4ff4-bf6c-e65492eb9c5b
    steps:
      - name: Verify remaining canonical facts
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          sql="select
            (select count(*) from public.investment_projects where id='${PROJECT_ID}'::uuid and internal_reference='DEMO-RE-2026-001')::int as project_exists,
            (select count(*) filter(where status='POSTED') from public.s7_opening_imports where project_id='${PROJECT_ID}'::uuid)::int as opening_posted,
            (select coalesce(max(declared_debit_total_minor_units),0) from public.s7_opening_imports where project_id='${PROJECT_ID}'::uuid)::bigint as opening_debit,
            (select coalesce(max(declared_credit_total_minor_units),0) from public.s7_opening_imports where project_id='${PROJECT_ID}'::uuid)::bigint as opening_credit,
            (select count(*) from (select batch_id from public.journal_lines where project_id='${PROJECT_ID}'::uuid group by batch_id having sum(debit_minor_units)<>sum(credit_minor_units) or count(*)<2) x)::int as unbalanced_batches,
            (select count(*) from public.s7_pilot_rehearsals where project_id='${PROJECT_ID}'::uuid and rehearsal_type='END_TO_END_CYCLE' and result='PASS')::int as demo_rehearsals,
            (select count(*) from public.s7_uat_tasks where project_id='${PROJECT_ID}'::uuid)::int as uat_tasks,
            (select count(*) from public.terranex_migration_history)::int as ledger_count;"
          jq -n --arg query "$sql" '{query:$query}' > "$tmp/q.json"
          row="$(curl --fail-with-body -sS -X POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @"$tmp/q.json" | jq -c '.[0]')"
          echo "FINAL_VERIFICATION=$row"
          test "$(printf '%s' "$row" | jq -r '.project_exists')" = '1'
          test "$(printf '%s' "$row" | jq -r '.opening_posted')" = '1'
          test "$(printf '%s' "$row" | jq -r '.opening_debit')" = '500000000'
          test "$(printf '%s' "$row" | jq -r '.opening_credit')" = '500000000'
          test "$(printf '%s' "$row" | jq -r '.unbalanced_batches')" = '0'
          test "$(printf '%s' "$row" | jq -r '.demo_rehearsals')" = '1'
          test "$(printf '%s' "$row" | jq -r '.uat_tasks')" = '0'
          test "$(printf '%s' "$row" | jq -r '.ledger_count')" = '37'
          echo "FINAL_PROJECT_ID=$PROJECT_ID"
          echo 'PERSISTENT_DEMO_FINAL_VERIFICATION=PASS'
          echo 'DEMO_PHASE2_CREDIT=false'
