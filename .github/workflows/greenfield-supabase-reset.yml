name: Terranex Pilot Security DB Replay

on:
  push:
    branches:
      - ops/greenfield-supabase-reset
    paths:
      - .github/workflows/greenfield-supabase-reset.yml

permissions:
  contents: read

jobs:
  db-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout hardening PR
        uses: actions/checkout@v4
        with:
          ref: fix/pilot-security-advisor
      - name: Run canonical migration replay and DB suites
        env:
          GITHUB_ACTIONS: 'true'
        run: bash scripts/db-test.sh
