name: Terranex Migration Ledger Columns

on:
  push:
    branches:
      - ops/greenfield-supabase-reset
    paths:
      - .github/workflows/greenfield-supabase-reset.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: nwpyeobuxzbdnnzyfyqw
    steps:
      - name: Inspect ledger column contract
        shell: bash
        run: |
          set -euo pipefail
          sql="select column_name, data_type, is_nullable, column_default
          from information_schema.columns
          where table_schema='public' and table_name='terranex_migration_history'
          order by ordinal_position;"
          payload="$(jq -n --arg q "$sql" '{query:$q}')"
          response="$(curl --fail-with-body -sS -X POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary "$payload")"
          printf '%s' "$response" | jq -r '.[] | "COLUMN=\(.column_name) TYPE=\(.data_type) NULLABLE=\(.is_nullable) DEFAULT=\(.column_default // "")"'
