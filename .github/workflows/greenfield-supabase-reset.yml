name: Terranex Activation Path Verification

on:
  push:
    branches:
      - ops/greenfield-supabase-reset
    paths:
      - .github/workflows/greenfield-supabase-reset.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: nwpyeobuxzbdnnzyfyqw
      APPLY_MIGRATIONS: 'false'
    steps:
      - name: Checkout activation repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/activation-migration-ledger

      - name: Install Supabase CLI for advisor verification
        run: npm install -g supabase@2.114.0 --no-audit --no-fund

      - name: Authenticate Supabase CLI without printing token
        run: supabase login --token "$SUPABASE_ACCESS_TOKEN" --no-browser

      - name: Run repaired activation inspection only
        shell: bash
        run: |
          set -euo pipefail
          output="$(bash .github/pilot-activation/activate.sh)"
          printf '%s\n' "$output"
          grep -q '^PROJECT_ACCESSIBLE=true$' <<< "$output"
          grep -q '^PROJECT_CLASSIFICATION=TERRANEX$' <<< "$output"
          grep -q '^MIGRATIONS_IN_SYNC=true$' <<< "$output"
          grep -q '^RLS_VERIFIED=true$' <<< "$output"
          grep -q '^FINANCIAL_CONTROLS_VERIFIED=true$' <<< "$output"
          grep -q '^SECURITY_VERIFIED=true$' <<< "$output"
          echo 'ACTIVATION_REPAIR_VERIFIED=true'
