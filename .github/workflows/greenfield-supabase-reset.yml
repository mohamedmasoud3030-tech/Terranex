name: Terranex Activation Repair Patch v3

on:
  push:
    branches:
      - ops/greenfield-supabase-reset
    paths:
      - .github/workflows/greenfield-supabase-reset.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout activation repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/activation-migration-ledger

      - name: Apply and validate focused patch
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          bash -n .github/pilot-activation/activate.sh
          git diff --check

      - name: Commit activation repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/pilot-activation/activate.sh
          git commit -m 'fix(ops): use resilient Management API verification'
          git push origin HEAD:fix/activation-migration-ledger
