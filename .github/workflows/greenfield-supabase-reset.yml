name: Terranex Activation Search Path Patch

on:
  push:
    branches:
      - ops/greenfield-supabase-reset
    paths:
      - .github/workflows/greenfield-supabase-reset.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout activation repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/activation-migration-ledger

      - name: Normalize canonical search path comparison
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; p=Path('.github/pilot-activation/activate.sh'); s=p.read_text(); old=\"pc like 'search_path=pg_catalog,public'\"; new=\"replace(pc,' ','') = 'search_path=pg_catalog,public'\"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new))"
          bash -n .github/pilot-activation/activate.sh
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/pilot-activation/activate.sh
          git commit -m 'fix(ops): normalize canonical search path check'
          git push origin HEAD:fix/activation-migration-ledger
