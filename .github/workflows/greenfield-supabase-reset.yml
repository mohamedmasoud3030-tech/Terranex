name: Terranex PR115 Live SQL Diagnostic

on:
  push:
    branches:
      - ops/greenfield-supabase-reset
    paths:
      - .github/workflows/greenfield-supabase-reset.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: nwpyeobuxzbdnnzyfyqw
    steps:
      - name: Checkout exact PR 115 head
        uses: actions/checkout@v4
        with:
          ref: bb61ebe63039a5596bad9bbbe3215cdfb2d86fa7
      - name: Run migration in a transaction and report only PostgreSQL error
        shell: bash
        run: |
          set -euo pipefail
          { echo 'begin;'; cat supabase/migrations/20260813000400_project_intake_readiness.sql; echo 'rollback;'; } > /tmp/probe.sql
          payload="$(jq -Rs '{query: .}' < /tmp/probe.sql)"
          code="$(curl -sS -o /tmp/response.json -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary "$payload")"
          echo "HTTP_STATUS=$code"
          if [[ "$code" == 2* ]]; then
            echo 'MIGRATION_PROBE_OK=true'
            exit 0
          fi
          jq -r '[.message // empty, .error // empty, .details // empty, .hint // empty] | map(select(length>0)) | .[]' /tmp/response.json | head -n 8
          exit 1
