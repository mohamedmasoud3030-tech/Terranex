name: Terranex Complete Demo Hosted Dry Run

on:
  push:
    branches:
      - ops/greenfield-supabase-reset
    paths:
      - .github/workflows/greenfield-supabase-reset.yml

permissions:
  contents: write

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: nwpyeobuxzbdnnzyfyqw
    steps:
      - name: Checkout demo seed branch
        uses: actions/checkout@v4
        with:
          ref: demo/real-estate-showcase-data
          fetch-depth: 1

      - name: Complete disposed lifecycle and persist seed source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/demo/seed_real_estate_showcase.sql')
          s=p.read_text()
          marker="  select id into v_recognition from public.property_sale_recognitions where disposition_id=v_disposition;"
          addition=marker+"\n  perform pg_temp.terranex_demo_run(v_checker, format(\n    $$select public.transition_property_asset(%L,%L,'EXITING','DISPOSED',\n      'اكتمل نقل السيطرة والاعتراف ببيع الأصل','DEMO-SALE-A-2026-01','demo-state-a-disposed')$$,\n    v_org, v_asset_a));"
          if addition not in s:
            assert s.count(marker)==1, s.count(marker)
            s=s.replace(marker,addition)
            p.write_text(s)
          PY
          git diff --check
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add scripts/demo/seed_real_estate_showcase.sql
            git commit -m 'fix(demo): complete disposed asset lifecycle'
            git push origin HEAD:demo/real-estate-showcase-data
          fi

      - name: Fetch tested lifecycle migration
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin fix/s3-lifecycle-chain-tip:refs/remotes/origin/fix/s3-lifecycle-chain-tip
          git show origin/fix/s3-lifecycle-chain-tip:supabase/migrations/20260813000600_s3_lifecycle_chain_tip.sql > /tmp/lifecycle.sql
          test -s /tmp/lifecycle.sql

      - name: Run lifecycle migration plus complete demo in one rollback transaction
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          { echo 'begin;'; cat /tmp/lifecycle.sql; cat scripts/demo/seed_real_estate_showcase.sql; echo 'rollback;'; } > "$tmp/dry.sql"
          jq -Rs '{query:.}' < "$tmp/dry.sql" > "$tmp/payload.json"
          http="$(curl -sS -o "$tmp/response.json" -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' --data-binary @"$tmp/payload.json")"
          echo "COMPLETE_DEMO_DRY_RUN_HTTP=$http"
          if [[ "$http" -ge 200 && "$http" -lt 300 ]]; then
            echo 'LIFECYCLE_CHAIN_TIP_HOSTED=PASS'
            echo 'COMPLETE_DEMO_DRY_RUN=PASS'
            exit 0
          fi
          jq -c '{code:(.code // .error_code // null),message:(.message // .error // .msg // "unknown database error"),hint:(.hint // null),details:(.details // null)}' "$tmp/response.json" || true
          exit 1
