name: Terranex Security Advisor API Probe

on:
  push:
    branches:
      - ops/greenfield-supabase-reset
    paths:
      - .github/workflows/greenfield-supabase-reset.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: nwpyeobuxzbdnnzyfyqw
    steps:
      - name: Probe safe advisor response shape
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/advisors.json -w '%{http_code}' \
            --retry 3 --retry-all-errors --retry-delay 1 \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/advisors/security" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")"
          echo "ADVISOR_HTTP=$code"
          [[ "$code" == 2* ]]
          echo "ADVISOR_JSON_TYPE=$(jq -r 'type' /tmp/advisors.json)"
          echo "ADVISOR_TOP_KEYS=$(jq -r 'if type=="object" then (keys|join(",")) else "array" end' /tmp/advisors.json)"
          echo "ADVISOR_ERROR_LEVEL_COUNT=$(jq '[.. | objects | select(((.level // .severity // "")|ascii_downcase) == "error")] | length' /tmp/advisors.json)"
