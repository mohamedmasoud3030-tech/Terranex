name: Terranex Activation Repair Live Gate

on:
  push:
    branches:
      - ops/greenfield-supabase-reset
    paths:
      - .github/workflows/greenfield-supabase-reset.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: nwpyeobuxzbdnnzyfyqw
      APPLY_MIGRATIONS: 'false'
    steps:
      - name: Checkout exact repaired activation head
        uses: actions/checkout@v4
        with:
          ref: def8d52a25e915fc7ab3ed4d6008806bd7b7e394

      - name: Run read-only live activation gate
        shell: bash
        run: |
          set -euo pipefail
          bash -n .github/pilot-activation/activate.sh
          output="$(bash .github/pilot-activation/activate.sh)"
          printf '%s\n' "$output"
          grep -q '^PROJECT_ACCESSIBLE=true$' <<< "$output"
          grep -q '^PROJECT_CLASSIFICATION=TERRANEX$' <<< "$output"
          grep -q '^MIGRATIONS_IN_SYNC=true$' <<< "$output"
          grep -q '^RLS_VERIFIED=true$' <<< "$output"
          grep -q '^FINANCIAL_CONTROLS_VERIFIED=true$' <<< "$output"
          grep -q '^SECURITY_VERIFIED=true$' <<< "$output"
          echo 'ACTIVATION_REPAIR_LIVE_GATE=PASS'
