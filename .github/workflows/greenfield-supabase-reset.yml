name: Terranex Apply S6 Production Scale Fixes Live

on:
  push:
    branches:
      - ops/greenfield-supabase-reset
    paths:
      - .github/workflows/greenfield-supabase-reset.yml

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: nwpyeobuxzbdnnzyfyqw
    steps:
      - name: Checkout exact merged main
        uses: actions/checkout@v4
        with:
          ref: 4aa2904422a674020b60e40c29ffaf47bc0d34af

      - name: Preflight live boundary
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          sql="select count(*)::int as ledger_count,
            exists(select 1 from public.terranex_migration_history where version='20260813000700_s6_close_bigint_totals') as m36,
            exists(select 1 from public.terranex_migration_history where version='20260813000800_s6_sequential_accounting_periods') as m37
            from public.terranex_migration_history;"
          jq -n --arg query "$sql" '{query:$query}' > "$tmp/q.json"
          row="$(curl --fail-with-body -sS -X POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @"$tmp/q.json" | jq -c '.[0]')"
          echo "LEDGER_COUNT_BEFORE=$(printf '%s' "$row" | jq -r '.ledger_count')"
          test "$(printf '%s' "$row" | jq -r '.ledger_count')" = '35'
          test "$(printf '%s' "$row" | jq -r '.m36')" = 'false'
          test "$(printf '%s' "$row" | jq -r '.m37')" = 'false'

      - name: Apply both exact migrations and fingerprints atomically
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          m36='supabase/migrations/20260813000700_s6_close_bigint_totals.sql'
          m37='supabase/migrations/20260813000800_s6_sequential_accounting_periods.sql'
          sha36="$(sha256sum "$m36" | awk '{print $1}')"
          sha37="$(sha256sum "$m37" | awk '{print $1}')"
          test "${#sha36}" -eq 64; test "${#sha37}" -eq 64
          {
            echo 'begin;'
            cat "$m36"
            printf "\ninsert into public.terranex_migration_history(version,sha256) values ('20260813000700_s6_close_bigint_totals','%s');\n" "$sha36"
            cat "$m37"
            printf "\ninsert into public.terranex_migration_history(version,sha256) values ('20260813000800_s6_sequential_accounting_periods','%s');\n" "$sha37"
            echo 'commit;'
          } > "$tmp/apply.sql"
          jq -Rs '{query:.}' < "$tmp/apply.sql" > "$tmp/payload.json"
          curl --fail-with-body -sS -X POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @"$tmp/payload.json" > /dev/null
          echo 'S6_LIVE_APPLY=PASS'

      - name: Verify ledger and live semantics
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          sha36="$(sha256sum supabase/migrations/20260813000700_s6_close_bigint_totals.sql | awk '{print $1}')"
          sha37="$(sha256sum supabase/migrations/20260813000800_s6_sequential_accounting_periods.sql | awk '{print $1}')"
          sql="select count(*)::int as ledger_count,
            exists(select 1 from public.terranex_migration_history where version='20260813000700_s6_close_bigint_totals' and sha256='${sha36}') as m36_ok,
            exists(select 1 from public.terranex_migration_history where version='20260813000800_s6_sequential_accounting_periods' and sha256='${sha37}') as m37_ok,
            pg_get_functiondef('public.s6_approve_close_run_impl(uuid,uuid,text)'::regprocedure) ~ 'v_cash_total[[:space:]]+bigint;' as cash_bigint,
            pg_get_functiondef('public.s6_approve_close_run_impl(uuid,uuid,text)'::regprocedure) ~ 'v_recognized_revenue_total[[:space:]]+bigint;' as revenue_bigint,
            to_regclass('public.accounting_periods_authoritative_unique') is null as old_index_gone,
            to_regclass('public.accounting_periods_scope_start_version_unique') is not null as new_index_present
            from public.terranex_migration_history;"
          jq -n --arg query "$sql" '{query:$query}' > "$tmp/q.json"
          row="$(curl --fail-with-body -sS -X POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @"$tmp/q.json" | jq -c '.[0]')"
          test "$(printf '%s' "$row" | jq -r '.ledger_count')" = '37'
          test "$(printf '%s' "$row" | jq -r '.m36_ok')" = 'true'
          test "$(printf '%s' "$row" | jq -r '.m37_ok')" = 'true'
          test "$(printf '%s' "$row" | jq -r '.cash_bigint')" = 'true'
          test "$(printf '%s' "$row" | jq -r '.revenue_bigint')" = 'true'
          test "$(printf '%s' "$row" | jq -r '.old_index_gone')" = 'true'
          test "$(printf '%s' "$row" | jq -r '.new_index_present')" = 'true'
          echo 'LEDGER_COUNT_AFTER=37'
          echo 'S6_LIVE_VERIFICATION=PASS'
