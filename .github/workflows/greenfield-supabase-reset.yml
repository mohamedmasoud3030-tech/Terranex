name: Terranex Demo Seed Dry-Run Diagnostic

on:
  push:
    branches:
      - ops/greenfield-supabase-reset
    paths:
      - .github/workflows/greenfield-supabase-reset.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: nwpyeobuxzbdnnzyfyqw
    steps:
      - name: Checkout exact demo seed branch
        uses: actions/checkout@v4
        with:
          ref: demo/real-estate-showcase-data

      - name: Run exact demo seed transaction and print safe error only
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          {
            echo 'begin;'
            cat scripts/demo/seed_real_estate_showcase.sql
            echo 'rollback;'
          } > "$tmp/dry.sql"
          jq -Rs '{query:.}' < "$tmp/dry.sql" > "$tmp/payload.json"
          http="$(curl -sS -o "$tmp/response.json" -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @"$tmp/payload.json")"
          echo "DRY_RUN_HTTP=$http"
          if [[ "$http" -ge 200 && "$http" -lt 300 ]]; then
            echo 'DEMO_DRY_RUN=PASS'
            exit 0
          fi
          jq -c '{code:(.code // .error_code // null),message:(.message // .error // .msg // "unknown database error"),hint:(.hint // null),details:(.details // null)}' "$tmp/response.json" || true
          exit 1
