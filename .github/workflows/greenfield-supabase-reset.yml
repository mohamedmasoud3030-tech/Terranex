name: Terranex Inspect S6 Close Function

on:
  push:
    branches:
      - ops/greenfield-supabase-reset
    paths:
      - .github/workflows/greenfield-supabase-reset.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: nwpyeobuxzbdnnzyfyqw
    steps:
      - name: Print only S6 monetary declaration and assignment fragments
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          sql="with f as (
            select pg_get_functiondef('public.s6_approve_close_run_impl(uuid,uuid,text)'::regprocedure) d
          ) select
            substring(d from 'v_fail_count[^;]*;') as fail_decl,
            substring(d from 'v_fail_count_text[^;]*;') as text_decl,
            substring(d from 'select coalesce\\(\\(select sum\\([\\s\\S]{0,500}?into v_fail_count[\\s\\S]{0,180}?from public.journal_lines jl') as cash_fragment,
            substring(d from 'select coalesce\\(sum\\(r.recognized_proceeds_minor_units\\), 0\\)[\\s\\S]{0,120}?into v_fail_count[\\s\\S]{0,120}?from public.property_sale_recognitions r') as revenue_fragment,
            position('recognized_revenue_minor_units' in d)::int as revenue_key_pos
          from f;"
          jq -n --arg query "$sql" '{query:$query}' > "$tmp/q.json"
          row="$(curl --fail-with-body -sS -X POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @"$tmp/q.json" | jq -c '.[0]')"
          printf '%s' "$row" | jq '{fail_decl,text_decl,cash_fragment,revenue_fragment,revenue_key_pos}'
