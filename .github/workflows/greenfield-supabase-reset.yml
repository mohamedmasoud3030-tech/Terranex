name: Terranex Pilot Security Hardening Apply

on:
  push:
    branches:
      - ops/greenfield-supabase-reset
    paths:
      - .github/workflows/greenfield-supabase-reset.yml

permissions:
  contents: read

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: nwpyeobuxzbdnnzyfyqw
      MIGRATION: supabase/migrations/20260813000300_pilot_security_advisor_hardening.sql
    steps:
      - name: Checkout exact hardening PR
        uses: actions/checkout@v4
        with:
          ref: fix/pilot-security-advisor

      - name: Verify target and apply exact forward migration
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          meta="$(curl --fail-with-body -sS "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")"
          test "$(printf '%s' "$meta" | jq -r '.name')" = 'Terranex'
          test "$(printf '%s' "$meta" | jq -r '.status')" = 'ACTIVE_HEALTHY'
          test -f "$MIGRATION"
          {
            echo 'begin;'
            cat "$MIGRATION"
            echo
            echo 'commit;'
          } > "$tmp/apply.sql"
          jq -Rs '{query:.}' "$tmp/apply.sql" > "$tmp/payload.json"
          curl --fail-with-body -sS -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @"$tmp/payload.json" >/dev/null
          version="$(basename "$MIGRATION" .sql)"
          digest="$(sha256sum "$MIGRATION" | awk '{print $1}')"
          printf "insert into public.terranex_migration_history(version,sha256) values ('%s','%s') on conflict (version) do update set sha256=excluded.sha256;\n" "$version" "$digest" > "$tmp/ledger.sql"
          jq -Rs '{query:.}' "$tmp/ledger.sql" > "$tmp/payload.json"
          curl --fail-with-body -sS -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @"$tmp/payload.json" >/dev/null
          echo "APPLIED_MIGRATION=$version"

      - name: Verify RLS, grants, search paths, ledger, and contract
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          query() {
            jq -n --arg query "$1" '{query:$query}' > "$tmp/payload.json"
            curl --fail-with-body -sS -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
              --data-binary @"$tmp/payload.json"
          }
          rls="$(query "select (c.relrowsecurity and c.relforcerowsecurity) ok from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname='s7_opening_mapping_codes';" | jq -r '.[0].ok')"
          policy="$(query "select exists(select 1 from pg_policies where schemaname='public' and tablename='s7_opening_mapping_codes' and policyname='s7_opening_mapping_codes_authenticated_read' and cmd='SELECT' and 'authenticated'=any(roles)) ok;" | jq -r '.[0].ok')"
          anon_exec="$(query "select has_function_privilege('anon','public.s5_configure_allocation_rules(uuid,uuid,uuid,text,uuid[],bigint[],bigint,text,text)','EXECUTE') ok;" | jq -r '.[0].ok')"
          auth_exec="$(query "select has_function_privilege('authenticated','public.s5_configure_allocation_rules(uuid,uuid,uuid,text,uuid[],bigint[],bigint,text,text)','EXECUTE') ok;" | jq -r '.[0].ok')"
          search_paths="$(query "select count(*)::int n from pg_proc where oid in ('public.s1_guard_agreement_version_immutable()'::regprocedure,'public.s1_guard_append_only()'::regprocedure,'public.s1_guard_commitment_terms_immutable()'::regprocedure) and array_to_string(proconfig,',') like '%search_path=pg_catalog, public%';" | jq -r '.[0].n')"
          ledger="$(query 'select count(*)::int n from public.terranex_migration_history;' | jq -r '.[0].n')"
          echo "S7_MAPPING_RLS=$rls"
          echo "S7_MAPPING_AUTH_POLICY=$policy"
          echo "S5_ANON_EXECUTE=$anon_exec"
          echo "S5_AUTHENTICATED_EXECUTE=$auth_exec"
          echo "S1_PINNED_SEARCH_PATHS=$search_paths/3"
          echo "MIGRATIONS_IN_LEDGER=$ledger/32"
          test "$rls" = true
          test "$policy" = true
          test "$anon_exec" = false
          test "$auth_exec" = true
          test "$search_paths" = 3
          test "$ledger" = 32

      - name: Security advisor after hardening
        shell: bash
        run: |
          set -euo pipefail
          result="$(curl --fail-with-body -sS "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/advisors/security" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")"
          errors="$(printf '%s' "$result" | jq '[.. | objects | (.level // .severity // empty) | strings | ascii_downcase] | map(select(. == "error")) | length')"
          anon_secdef="$(printf '%s' "$result" | jq '[.. | objects | select((.name // .lint_name // "") == "anon_security_definer_function_executable")] | length')"
          mutable_s1="$(printf '%s' "$result" | jq '[.. | objects | select((.name // .lint_name // "") == "function_search_path_mutable") | (.detail // "") | select(test("s1_guard_"))] | length')"
          echo "SECURITY_ADVISOR_ERRORS=$errors"
          echo "ANON_SECURITY_DEFINER_FINDINGS=$anon_secdef"
          echo "S1_MUTABLE_SEARCH_PATH_FINDINGS=$mutable_s1"
          test "$errors" = 0
          test "$anon_secdef" = 0
          test "$mutable_s1" = 0
