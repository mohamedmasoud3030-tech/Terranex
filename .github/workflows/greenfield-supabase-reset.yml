name: Terranex PR115 Live Migration State

on:
  push:
    branches:
      - ops/greenfield-supabase-reset
    paths:
      - .github/workflows/greenfield-supabase-reset.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: nwpyeobuxzbdnnzyfyqw
    steps:
      - name: Inspect safe live migration state
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          sql="select
            to_regclass('public.terranex_migration_history') is not null as ledger_exists,
            case when to_regclass('public.terranex_migration_history') is null then false else exists(select 1 from public.terranex_migration_history where version='20260813000400_project_intake_readiness') end as target_recorded,
            (select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind in ('r','p') and c.relname in ('project_intake_declarations','project_intake_section_applicability','project_intake_modelling_gaps','project_intake_evidence_items')) as intake_table_count;"
          payload="$(jq -n --arg q "$sql" '{query:$q}')"
          response="$(curl --fail-with-body -sS -X POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary "$payload")"
          ledger="$(printf '%s' "$response" | jq -r '.[0].ledger_exists // false')"
          recorded="$(printf '%s' "$response" | jq -r '.[0].target_recorded // false')"
          count="$(printf '%s' "$response" | jq -r '.[0].intake_table_count // -1')"
          echo "LEDGER_EXISTS=$ledger"
          echo "TARGET_MIGRATION_RECORDED=$recorded"
          echo "INTAKE_TABLE_COUNT=$count"
