name: Terranex Greenfield Verification

on:
  push:
    branches:
      - ops/greenfield-supabase-reset
    paths:
      - .github/workflows/greenfield-supabase-reset.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: nwpyeobuxzbdnnzyfyqw
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Greenfield schema and frontend/backend contract
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          query() {
            jq -n --arg query "$1" '{query:$query}' > "$tmp/payload.json"
            curl --fail-with-body -sS -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary @"$tmp/payload.json"
          }

          meta="$(curl --fail-with-body -sS "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")"
          test "$(printf '%s' "$meta" | jq -r '.name')" = 'Terranex'
          test "$(printf '%s' "$meta" | jq -r '.status')" = 'ACTIVE_HEALTHY'

          python - <<'PY' > "$tmp/contract.json"
          import json, pathlib, re
          src='\n'.join(p.read_text(errors='ignore') for p in pathlib.Path('src').rglob('*') if p.suffix in {'.ts','.tsx','.js','.jsx'})
          print(json.dumps({
            'tables': sorted(set(re.findall(r"\.from\(\s*['\"]([A-Za-z0-9_]+)['\"]", src))),
            'rpcs': sorted(set(re.findall(r"\.rpc\(\s*['\"]([A-Za-z0-9_]+)['\"]", src)))
          }))
          PY

          canonical="$(grep -rhoiE "create table( if not exists)?[[:space:]]+public\.[a-z0-9_]+" supabase/migrations/*.sql | sed -E 's/.*public\.//I' | tr 'A-Z' 'a-z' | sort -u)"
          expected="$(printf '%s\n' "$canonical" | sed '/^$/d' | wc -l | tr -d ' ')"
          table_sql="$(printf '%s\n' "$canonical" | sed '/^$/d' | sed "s/'/''/g;s/.*/'&'/" | paste -sd, -)"

          forced="$(grep -rhoiE "alter table[[:space:]]+public\.[a-z0-9_]+[[:space:]]+force row level security" supabase/migrations/*.sql | sed -E 's/.*public\.([a-z0-9_]+).*/\1/I' | tr 'A-Z' 'a-z' | sort -u)"
          forced_expected="$(printf '%s\n' "$forced" | sed '/^$/d' | wc -l | tr -d ' ')"
          forced_sql="$(printf '%s\n' "$forced" | sed '/^$/d' | sed "s/'/''/g;s/.*/'&'/" | paste -sd, -)"

          live="$(query "select count(*)::int n from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind in ('r','p') and c.relname=any(array[$table_sql]);" | jq -r '.[0].n')"
          unrelated="$(query "select count(*)::int n from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind in ('r','p') and c.relname<>all(array[$table_sql]) and c.relname<>'terranex_migration_history';" | jq -r '.[0].n')"
          forced_live="$(query "select count(*)::int n from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind in ('r','p') and c.relname=any(array[$forced_sql]) and c.relrowsecurity and c.relforcerowsecurity;" | jq -r '.[0].n')"
          ledger="$(query 'select count(*)::int n from public.terranex_migration_history;' | jq -r '.[0].n')"
          migrations="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"

          tables_json="$(jq -c '.tables' "$tmp/contract.json")"
          rpcs_json="$(jq -c '.rpcs' "$tmp/contract.json")"
          missing_tables="$(query "with wanted(name) as (select jsonb_array_elements_text('$tables_json'::jsonb)) select coalesce(jsonb_agg(name order by name),'[]'::jsonb) missing from wanted where to_regclass('public.'||name) is null;" | jq -c '.[0].missing')"
          missing_rpcs="$(query "with wanted(name) as (select jsonb_array_elements_text('$rpcs_json'::jsonb)) select coalesce(jsonb_agg(name order by name),'[]'::jsonb) missing from wanted where not exists(select 1 from pg_proc p where p.pronamespace='public'::regnamespace and p.proname=wanted.name);" | jq -c '.[0].missing')"

          anchor_ok="$(query "select (
            exists(select 1 from pg_proc where pronamespace='public'::regnamespace and proname='s6_evaluate_gate')
            and (select count(*) from pg_trigger where tgname in ('a_s6_close_serialization_batch_lock','a_s6_close_serialization_line_lock') and not tgisinternal)=2
            and exists(select 1 from pg_trigger where tgname='audit_events_append_only' and not tgisinternal)
            and exists(select 1 from pg_trigger where tgname='journal_lines_balance_guard' and not tgisinternal)
            and to_regclass('public.s7_opening_imports') is not null
            and to_regclass('public.s7_reconciliation_checkpoints') is not null
          ) as ok;" | jq -r '.[0].ok')"

          echo "PROJECT_NAME=$(printf '%s' "$meta" | jq -r '.name')"
          echo "PROJECT_STATUS=$(printf '%s' "$meta" | jq -r '.status')"
          echo "PROJECT_REGION=$(printf '%s' "$meta" | jq -r '.region')"
          echo "CANONICAL_TABLES=$live/$expected"
          echo "RLS_FORCE_REQUIRED=$forced_live/$forced_expected"
          echo "UNRELATED_PUBLIC_TABLES=$unrelated"
          echo "MIGRATIONS_IN_LEDGER=$ledger/$migrations"
          echo "FRONTEND_TABLE_COUNT=$(jq '.tables|length' "$tmp/contract.json")"
          echo "FRONTEND_RPC_COUNT=$(jq '.rpcs|length' "$tmp/contract.json")"
          echo "FRONTEND_MISSING_TABLES=$missing_tables"
          echo "FRONTEND_MISSING_RPCS=$missing_rpcs"
          echo "SECURITY_ANCHORS_OK=$anchor_ok"

          test "$live" = "$expected"
          test "$unrelated" = '0'
          test "$forced_live" = "$forced_expected"
          test "$ledger" = "$migrations"
          test "$missing_tables" = '[]'
          test "$missing_rpcs" = '[]'
          test "$anchor_ok" = 'true'
          echo 'FRONTEND_BACKEND_OBJECT_CONTRACT=true'
          echo 'GREENFIELD_SCHEMA_VERIFIED=true'

      - name: Inspect or create modern publishable key safely
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          keys="$(curl --fail-with-body -sS "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys?reveal=false" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")"
          printf '%s' "$keys" | jq -c 'if type=="array" then map({id,name,type,disabled}) elif ((.api_keys // null)|type)=="array" then .api_keys|map({id,name,type,disabled}) else [] end' > "$tmp/safe-key-metadata.json"
          echo "KEY_METADATA=$(cat "$tmp/safe-key-metadata.json")"
          has="$(printf '%s' "$keys" | jq -r '(if type=="array" then . elif ((.api_keys // null)|type)=="array" then .api_keys else [] end) | map(select((.type // "") == "publishable" and ((.disabled // false) == false))) | length > 0')"
          if [[ "$has" != 'true' ]]; then
            http="$(curl -sS -o "$tmp/create.json" -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys?reveal=false" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H 'Content-Type: application/json' \
              --data '{"type":"publishable","name":"terranex-web"}')"
            echo "PUBLISHABLE_CREATE_HTTP=$http"
            if [[ "$http" -lt 200 || "$http" -ge 300 ]]; then
              jq -c '{code:(.code // null),message:(.message // .error // "request rejected")}' "$tmp/create.json" || true
            fi
          fi
          keys="$(curl --fail-with-body -sS "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys?reveal=false" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")"
          has="$(printf '%s' "$keys" | jq -r '(if type=="array" then . elif ((.api_keys // null)|type)=="array" then .api_keys else [] end) | map(select((.type // "") == "publishable" and ((.disabled // false) == false))) | length > 0')"
          echo "NEXT_PUBLIC_SUPABASE_URL=https://$SUPABASE_PROJECT_REF.supabase.co"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY_AVAILABLE=$has"
          test "$has" = 'true'

      - name: Supabase security advisor
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result="$(curl --fail-with-body -sS "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/advisors/security" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")"
          errors="$(printf '%s' "$result" | jq '[.. | objects | (.level // .severity // empty) | strings | ascii_downcase] | map(select(. == "error")) | length')"
          warnings="$(printf '%s' "$result" | jq '[.. | objects | (.level // .severity // empty) | strings | ascii_downcase] | map(select(. == "warning")) | length')"
          echo "SECURITY_ADVISOR_ERRORS=$errors"
          echo "SECURITY_ADVISOR_WARNINGS=$warnings"
          test "$errors" = '0'
