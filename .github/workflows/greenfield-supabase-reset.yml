name: Terranex Migration Ledger Ownership

on:
  push:
    branches:
      - ops/greenfield-supabase-reset
    paths:
      - .github/workflows/greenfield-supabase-reset.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: nwpyeobuxzbdnnzyfyqw
    steps:
      - name: Inspect safe ledger execution identity
        shell: bash
        run: |
          set -euo pipefail
          sql="select current_user,
            pg_get_userbyid(c.relowner) as ledger_owner,
            r.rolsuper as current_superuser,
            r.rolbypassrls as current_bypassrls,
            has_table_privilege(current_user,'public.terranex_migration_history','INSERT') as can_insert,
            c.relrowsecurity as rls_enabled,
            c.relforcerowsecurity as rls_forced
          from pg_class c join pg_roles r on r.rolname=current_user
          where c.oid='public.terranex_migration_history'::regclass;"
          payload="$(jq -n --arg q "$sql" '{query:$q}')"
          response="$(curl --fail-with-body -sS -X POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary "$payload")"
          printf '%s' "$response" | jq -r '.[0] | "CURRENT_USER=\(.current_user)\nLEDGER_OWNER=\(.ledger_owner)\nCURRENT_SUPERUSER=\(.current_superuser)\nCURRENT_BYPASSRLS=\(.current_bypassrls)\nCAN_INSERT=\(.can_insert)\nRLS_ENABLED=\(.rls_enabled)\nRLS_FORCED=\(.rls_forced)"'
