name: Terranex Security Definer Search Path Probe

on:
  push:
    branches:
      - ops/greenfield-supabase-reset
    paths:
      - .github/workflows/greenfield-supabase-reset.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: nwpyeobuxzbdnnzyfyqw
    steps:
      - name: List Terranex public SECURITY DEFINER search-path offenders
        shell: bash
        run: |
          set -euo pipefail
          sql="select p.oid::regprocedure::text as signature,
            coalesce(array_to_string(p.proconfig, ','), '') as config
          from pg_proc p
          where p.prosecdef
            and p.pronamespace='public'::regnamespace
            and (p.proconfig is null or not exists (
              select 1 from unnest(p.proconfig) pc
              where pc like 'search_path=pg_catalog,public'
            ))
          order by 1;"
          payload="$(jq -n --arg q "$sql" '{query:$q}')"
          response="$(curl --fail-with-body -sS --retry 3 --retry-all-errors --retry-delay 1 \
            -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary "$payload")"
          echo "OFFENDER_COUNT=$(printf '%s' "$response" | jq 'length')"
          printf '%s' "$response" | jq -r '.[] | "FUNCTION=\(.signature) CONFIG=\(.config)"'
