name: Terranex Apply Pgcrypto Compatibility Live

on:
  push:
    branches:
      - ops/greenfield-supabase-reset
    paths:
      - .github/workflows/greenfield-supabase-reset.yml

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: nwpyeobuxzbdnnzyfyqw
      MIGRATION_VERSION: 20260813000500_pgcrypto_digest_schema_compat
    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          ref: 82c53c1c5d4794458a8243399c4b6b2953d84cf3

      - name: Verify live migration boundary
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          sql="select (select count(*) from public.terranex_migration_history)::int as ledger_count,
                      exists(select 1 from public.terranex_migration_history where version='${MIGRATION_VERSION}') as already_applied,
                      (select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                       where n.nspname='public' and p.prokind='f'
                         and pg_get_functiondef(p.oid) ~ '(^|[^[:alnum:]_.])digest[[:space:]]*\\(')::int as unqualified_digest_count;"
          jq -n --arg query "$sql" '{query:$query}' > "$tmp/q.json"
          row="$(curl --fail-with-body -sS -X POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' --data-binary @"$tmp/q.json" | jq -c '.[0]')"
          echo "LEDGER_COUNT_BEFORE=$(printf '%s' "$row" | jq -r '.ledger_count')"
          echo "ALREADY_APPLIED=$(printf '%s' "$row" | jq -r '.already_applied')"
          echo "UNQUALIFIED_DIGEST_BEFORE=$(printf '%s' "$row" | jq -r '.unqualified_digest_count')"
          test "$(printf '%s' "$row" | jq -r '.ledger_count')" = '33'
          test "$(printf '%s' "$row" | jq -r '.already_applied')" = 'false'

      - name: Apply exact merged migration and fingerprint atomically
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          file="supabase/migrations/${MIGRATION_VERSION}.sql"
          test -s "$file"
          sha="$(sha256sum "$file" | awk '{print $1}')"
          test "${#sha}" -eq 64
          escaped_sha="$(printf '%s' "$sha" | sed "s/'/''/g")"
          {
            echo 'begin;'
            cat "$file"
            printf "\ninsert into public.terranex_migration_history(version,sha256) values ('%s','%s');\n" "$MIGRATION_VERSION" "$escaped_sha"
            echo 'commit;'
          } > "$tmp/apply.sql"
          jq -Rs '{query:.}' < "$tmp/apply.sql" > "$tmp/payload.json"
          curl --fail-with-body -sS -X POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' --data-binary @"$tmp/payload.json" > /dev/null
          echo 'LIVE_MIGRATION_APPLIED=true'

      - name: Verify hosted pgcrypto compatibility and ledger
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          file="supabase/migrations/${MIGRATION_VERSION}.sql"
          sha="$(sha256sum "$file" | awk '{print $1}')"
          sql="select (select count(*) from public.terranex_migration_history)::int as ledger_count,
                      exists(select 1 from public.terranex_migration_history where version='${MIGRATION_VERSION}' and sha256='${sha}') as fingerprint_ok,
                      (select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace
                       where n.nspname='public' and p.prokind='f'
                         and pg_get_functiondef(p.oid) ~ '(^|[^[:alnum:]_.])digest[[:space:]]*\\(')::int as unqualified_digest_count;"
          jq -n --arg query "$sql" '{query:$query}' > "$tmp/q.json"
          row="$(curl --fail-with-body -sS -X POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' --data-binary @"$tmp/q.json" | jq -c '.[0]')"
          test "$(printf '%s' "$row" | jq -r '.ledger_count')" = '34'
          test "$(printf '%s' "$row" | jq -r '.fingerprint_ok')" = 'true'
          test "$(printf '%s' "$row" | jq -r '.unqualified_digest_count')" = '0'
          echo 'LEDGER_COUNT_AFTER=34'
          echo 'PGCRYPTO_HOSTED_COMPATIBILITY=PASS'
