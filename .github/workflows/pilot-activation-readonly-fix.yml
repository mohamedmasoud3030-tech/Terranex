name: Terranex Pilot Activation Readonly Fix

on:
  push:
    branches:
      - fix/pilot-activation-project-list-json
    paths:
      - .github/workflows/pilot-activation-readonly-fix.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: npm install -g supabase@2.114.0 --no-audit --no-fund

      - name: Authenticate to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase login --token "$SUPABASE_ACCESS_TOKEN" --no-browser

      - name: Patch project-list parser in checked-out copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/pilot-activation/activate.sh')
          s = p.read_text()
          old = '''PROJ="$(printf '%s' "$LIST_JSON" | jq -c --arg ref "$REF" '[.[] | select(.id == $ref)][0]')"'''
          new = '''PROJ="$(printf '%s' "$LIST_JSON" | jq -c --arg ref "$REF" '(if type == "array" then . elif (type == "object" and (.projects? | type) == "array") then .projects else [] end) | map(select((.id // .ref // "") == $ref))[0] // null')"'''
          if old not in s:
              raise SystemExit('expected parser line not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Inspect Terranex project read-only
        env:
          SUPABASE_PROJECT_REF: nwpyeobuxzbdnnzyfyqw
          APPLY_MIGRATIONS: 'false'
        run: bash .github/pilot-activation/activate.sh
