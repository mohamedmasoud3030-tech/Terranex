name: Quality Gate

# Required check for every PR into main. All five gates must pass:
#   npm ci → npm run typecheck → npm run lint → npm run test → npm run build
#
# Mark this workflow's `verify` job as a required status check in
# Settings → Branches → Branch protection rules for `main`, otherwise the
# workflow only reports and does not actually block a merge.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR cancels the previous run.
concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # --ignore-scripts blocks dependency lifecycle scripts (supply-chain
      # hardening). Verified: typecheck, test, and build all pass without them.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # Guards the test suite itself: if the suites only pass because they run in a
  # fixed order and share state, running each file in its own Node process will
  # expose it. This is the CI-side counterpart to the isolation assertions in
  # tests/supabase-store-contract.test.cjs.
  test-isolation:
    name: test isolation (per-file processes)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Use the locally installed compiler rather than `npx`, which can fetch
      # and execute an unpinned package on demand.
      - name: Compile test sources
        run: ./node_modules/.bin/tsc -p tsconfig.test.json

      - name: Run each test file in a separate process
        run: |
          status=0
          for file in tests/*.test.cjs; do
            echo "::group::$file"
            node --import tsx --test "$file" || status=1
            echo "::endgroup::"
          done
          exit $status
