name: Repository Cleanup Once

on:
  pull_request:
    branches:
      - greenfield/foundation
    types: [opened, synchronize, closed]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'greenfield/repository-cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged cleanup branch after close
        if: github.event.action == 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'heads/greenfield/repository-cleanup',
              });
            } catch (error) {
              core.warning(`Cleanup branch deletion: ${error.message}`);
            }

      - uses: actions/checkout@v4
        if: github.event.action != 'closed'
        with:
          ref: greenfield/repository-cleanup

      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 20

      - name: Generate deterministic npm lockfile
        if: github.event.action != 'closed'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile to cleanup branch
        if: github.event.action != 'closed'
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'package-lock.json already current'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore(greenfield): lock npm dependency graph'
            git push origin HEAD:greenfield/repository-cleanup
          fi

      - name: Delete obsolete remote branches
        if: github.event.action != 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const keep = new Set([
              'main',
              'greenfield/foundation',
              'legacy/pre-greenfield-20260810',
              'greenfield/repository-cleanup',
            ]);
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            for (const branch of branches) {
              if (keep.has(branch.name)) continue;
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branch.name}`,
                });
                core.info(`Deleted ${branch.name}`);
              } catch (error) {
                core.warning(`Could not delete ${branch.name}: ${error.message}`);
              }
            }
