name: Delete GF003 Branches Once

on:
  pull_request:
    branches:
      - greenfield/foundation
    types: [opened]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'greenfield/cleanup-after-gf003'
    runs-on: ubuntu-latest
    steps:
      - name: Delete completed execution branches
        uses: actions/github-script@v7
        with:
          script: |
            const refs = [
              'heads/arena/019fed07-terranex',
              'heads/greenfield/gf-003-s1-clean',
              'heads/greenfield/cleanup-after-gf003',
            ];
            for (const ref of refs) {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref,
                });
                core.info(`Deleted ${ref}`);
              } catch (error) {
                core.warning(`Could not delete ${ref}: ${error.message}`);
              }
            }
