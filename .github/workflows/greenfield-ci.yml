name: Greenfield CI

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-publishable-key
      - run: npm run typecheck

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - name: Environment diagnostics
        if: always()
        run: |
          echo "psql: $(command -v psql || echo MISSING)"; psql --version || true
          pg_isready -h 127.0.0.1 -p 5432 -U postgres || echo "pg_isready failed"
          echo "gates: $(ls supabase/tests/*.sql | wc -l) migrations: $(ls supabase/migrations/*.sql | wc -l)"
      - name: PostgreSQL replay and two-tenant isolation
        run: bash -x ./scripts/db-test.sh 2>&1 | tail -n 80
