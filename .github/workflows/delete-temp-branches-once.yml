name: Delete Temporary Branches Once

on:
  pull_request:
    branches:
      - greenfield/foundation
    types: [opened]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'greenfield/delete-temp-branches'
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary branches
        uses: actions/github-script@v7
        with:
          script: |
            for (const branch of ['greenfield/repository-cleanup', 'greenfield/delete-temp-branches']) {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branch}`,
                });
                core.info(`Deleted ${branch}`);
              } catch (error) {
                if (error.status === 422 || error.status === 404) {
                  core.info(`${branch} already absent`);
                } else {
                  throw error;
                }
              }
            }
